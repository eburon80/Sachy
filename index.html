<div class="r" style="margin:10px 0;flex-wrap:wrap;justify-content:flex-start"><button class="p" data-a="form">Nová hra</button><button data-a="name">Jméno</button><button data-a="theme">Vzhled</button><button data-a="push">${ls('tok')?'Notifikace: zap.':'Notifikace'}</button>${inst?'<button data-a="install">Nainstalovat</button>':''}</div>${ui.form?form():''}${ui.theme?themes():''}
